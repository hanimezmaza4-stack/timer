<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مؤقت</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --text:#f1f5f9; --muted:#94a3b8;
    --accent:#38bdf8; --accent2:#22d3ee; --ok:#4ade80; --danger:#f87171; --border:#334155;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
  body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:1.5rem;margin:20px 0 12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:16px}
  label.t{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=number],input[type=datetime-local],select{
    width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:12px;font-size:1rem;text-align:center;font-family:inherit}
  input[type=text]{text-align:right}
  select{text-align:right;appearance:auto}
  input[type=datetime-local]{min-height:48px}
  input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .grid label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .chip{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:999px;
    padding:7px 12px;font-size:.85rem;cursor:pointer;font-family:inherit}
  .chip:active{transform:scale(.96)}
  button.primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06283d;
    border:0;border-radius:14px;padding:14px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
  button.primary:active{transform:scale(.98)}
  button.primary:disabled{opacity:.45}
  .err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:8px 0 0;text-align:center}
  .empty{text-align:center;color:var(--muted);padding:28px 8px}

  /* تبويبات */
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:5px;margin-bottom:16px}
  .tabs button{flex:1;background:transparent;color:var(--muted);border:0;border-radius:10px;
    padding:10px;font-size:1rem;font-family:inherit;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--text);font-weight:700}

  /* اختيار نوع المؤقت */
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;background:var(--bg);color:var(--muted);border:1px solid var(--border);
    border-radius:12px;padding:10px;font-size:.95rem;font-family:inherit;cursor:pointer}
  .seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}

  .soundRow{display:flex;gap:8px;align-items:stretch;margin:14px 0}
  .soundRow select{flex:1}
  .soundRow button{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:0 16px;font-size:.95rem;cursor:pointer;font-family:inherit}

  .timer{position:relative;overflow:hidden}
  .timer.done{border-color:var(--ok)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-weight:700;font-size:1.05rem;word-break:break-word}
  .end{color:var(--muted);font-size:.8rem;margin-top:2px}
  .units{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 10px;direction:rtl}
  .u{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:58px;text-align:center}
  .u b{display:block;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
  .u span{font-size:.72rem;color:var(--muted)}
  .bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
  .done .bar i{background:var(--ok)}
  .doneText{text-align:center;color:var(--ok);font-weight:700;font-size:1.2rem;margin:14px 0 10px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:9px;font-size:.9rem;cursor:pointer;font-family:inherit}
  .acts button.del{color:var(--danger)}
  #install{display:none;margin-bottom:16px}

  /* الكرونومتر */
  .swDisplay{direction:ltr;text-align:center;font-variant-numeric:tabular-nums;
    font-size:clamp(2.2rem,12vw,3.4rem);font-weight:700;letter-spacing:1px;margin:18px 0 22px}
  .swDisplay small{font-size:.5em;color:var(--accent);font-weight:600}
  .swBtns{display:flex;gap:10px}
  .swBtns button{flex:1;border:1px solid var(--border);border-radius:14px;padding:14px;font-size:1rem;
    cursor:pointer;font-family:inherit;background:var(--card2);color:var(--text)}
  .swBtns button.go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06283d;border:0;font-weight:700}
  .swBtns button.stop{background:var(--danger);color:#2b0a0a;border:0;font-weight:700}
  .swBtns button:disabled{opacity:.4}
  .laps{margin-top:16px}
  .lap{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--border);
    font-variant-numeric:tabular-nums}
  .lap .n{color:var(--muted);min-width:56px}
  .lap .v{direction:ltr}
  .lap .tot{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>⏳ مؤقت</h1>

  <div class="tabs">
    <button id="tabTimer" class="on" type="button">المؤقت</button>
    <button id="tabSw" type="button">الكرونومتر</button>
  </div>

  <button id="install" class="primary">تثبيت التطبيق على الهاتف</button>

  <!-- ===== المؤقت ===== -->
  <section id="vTimer">
    <div class="card">
      <label class="t" for="label">اسم المؤقت (اختياري)</label>
      <input type="text" id="label" placeholder="مثال: الامتحان، السفر، موعد الدواء" maxlength="60">

      <div class="seg" style="margin-top:14px">
        <button type="button" id="modeDur" class="on">بعد مدة</button>
        <button type="button" id="modeDate">حتى تاريخ محدد</button>
      </div>

      <div id="durBox">
        <div class="grid">
          <div><label for="y">سنوات</label><input type="number" id="y" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="mo">أشهر</label><input type="number" id="mo" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="d">أيام</label><input type="number" id="d" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="h">ساعات</label><input type="number" id="h" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="mi">دقائق</label><input type="number" id="mi" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="s">ثوانٍ</label><input type="number" id="s" min="0" inputmode="numeric" placeholder="0"></div>
        </div>
        <label class="t">اختيارات سريعة</label>
        <div class="chips" id="chips"></div>
      </div>

      <div id="dateBox" hidden style="margin:12px 0 4px">
        <label class="t" for="dt">يتوقف المؤقت في هذا التاريخ والوقت</label>
        <input type="datetime-local" id="dt">
      </div>

      <label class="t" for="sound">صوت التنبيه</label>
      <div class="soundRow">
        <select id="sound"></select>
        <button type="button" id="test">▶ تجربة</button>
      </div>

      <button class="primary" id="start">ابدأ المؤقت</button>
      <p class="err" id="err"></p>
    </div>

    <div id="list"></div>
  </section>

  <!-- ===== الكرونومتر ===== -->
  <section id="vSw" hidden>
    <div class="card">
      <div class="swDisplay" id="swDisplay">00:00:00<small>.00</small></div>
      <div class="swBtns">
        <button type="button" id="swReset" disabled>تصفير</button>
        <button type="button" id="swLap" disabled>لفّة</button>
        <button type="button" id="swGo" class="go">ابدأ</button>
      </div>
      <div class="laps" id="laps"></div>
    </div>
  </section>
</div>

<script>
(function(){
  var KEY = 'timers.v1', SKEY = 'timer.sound', TKEY = 'timer.tab', SWKEY = 'sw.v1';
  var $ = function(id){ return document.getElementById(id); };

  function lsGet(k, def){ try { var v = localStorage.getItem(k); return v === null ? def : v; } catch(e){ return def; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var timers = [];
  try { timers = JSON.parse(lsGet(KEY, '[]')) || []; } catch(e){ timers = []; }
  function save(){ lsSet(KEY, JSON.stringify(timers)); }

  // ======================= الأصوات =======================
  var actx = null;
  function getCtx(){
    try {
      if (!actx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        actx = new C();
      }
      if (actx.state === 'suspended') actx.resume();
    } catch(e){ return null; }
    return actx;
  }
  ['click','touchstart','keydown'].forEach(function(ev){
    document.addEventListener(ev, function(){ getCtx(); }, {passive:true});
  });

  function tone(c, freq, start, dur, type, gain){
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }
  function sweep(c, f1, f2, start, dur, gain){
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f1, start);
    o.frequency.exponentialRampToValueAtTime(f2, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }

  var SOUNDS = {
    beep:  {name:'بيب كلاسيكي', len:1500, play:function(c,t){ [0,.35,.7].forEach(function(o){ tone(c,880,t+o,.2,'sine',.25); }); }},
    bell:  {name:'جرس',          len:2800, play:function(c,t){
      [0,1.3].forEach(function(o){
        tone(c,1318,t+o,1.4,'sine',.3); tone(c,1760,t+o,1.1,'sine',.14); tone(c,2637,t+o,.7,'sine',.07);
      });
    }},
    alarm: {name:'منبّه',        len:1700, play:function(c,t){
      for (var i = 0; i < 8; i++) tone(c, i % 2 ? 1000 : 760, t + i * .2, .17, 'square', .12);
    }},
    soft:  {name:'نغمة هادئة',   len:2200, play:function(c,t){
      [523,659,784,1047].forEach(function(f,i){ tone(c,f,t+i*.28,1,'sine',.22); });
    }},
    chime: {name:'رنين',         len:1700, play:function(c,t){
      [1568,1319,1047,1319,1568].forEach(function(f,i){ tone(c,f,t+i*.22,.5,'triangle',.2); });
    }},
    siren: {name:'صفّارة',       len:2300, play:function(c,t){
      for (var i = 0; i < 3; i++) sweep(c, 450, 1200, t + i * .75, .7, .12);
    }},
    none:  {name:'بدون صوت',     len:0,    play:function(){}}
  };

  var soundSel = $('sound');
  Object.keys(SOUNDS).forEach(function(k){
    var op = document.createElement('option');
    op.value = k; op.textContent = SOUNDS[k].name;
    soundSel.appendChild(op);
  });
  var savedSound = lsGet(SKEY, 'beep');
  soundSel.value = SOUNDS[savedSound] ? savedSound : 'beep';
  soundSel.onchange = function(){ lsSet(SKEY, soundSel.value); playSound(soundSel.value, 1); };
  $('test').onclick = function(){ playSound(soundSel.value, 1); };

  function playSound(name, times){
    var s = SOUNDS[name];
    if (!s || name === 'none') return;
    var c = getCtx();
    if (!c) return;
    (function go(n){
      try { s.play(c, c.currentTime + 0.03); } catch(e){}
      if (n > 1) setTimeout(function(){ go(n - 1); }, s.len + 500);
    })(times || 1);
  }

  // ======================= التبويبات =======================
  var view = 'timer';
  function showTab(n){
    view = n;
    $('vTimer').hidden = n !== 'timer';
    $('vSw').hidden = n !== 'sw';
    $('tabTimer').className = n === 'timer' ? 'on' : '';
    $('tabSw').className = n === 'sw' ? 'on' : '';
    lsSet(TKEY, n);
    if (n === 'sw') drawSw();
  }
  $('tabTimer').onclick = function(){ showTab('timer'); };
  $('tabSw').onclick = function(){ showTab('sw'); };

  // ======================= المؤقت =======================
  var fields = ['y','mo','d','h','mi','s'];
  var mode = 'dur';

  var presets = [
    ['30 ثانية',{s:30}], ['5 دقائق',{mi:5}], ['25 دقيقة',{mi:25}], ['ساعة',{h:1}],
    ['يوم',{d:1}], ['أسبوع',{d:7}], ['شهر',{mo:1}], ['سنة',{y:1}], ['5 سنوات',{y:5}]
  ];
  presets.forEach(function(p){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = p[0];
    b.onclick = function(){ fillFields(p[1]); };
    $('chips').appendChild(b);
  });
  function fillFields(spec){ fields.forEach(function(f){ $(f).value = spec[f] ? spec[f] : ''; }); }
  function readSpec(){
    var spec = {};
    fields.forEach(function(f){
      var v = parseInt($(f).value, 10);
      spec[f] = (isFinite(v) && v > 0) ? v : 0;
    });
    return spec;
  }

  function pad(n, w){ n = String(n); while (n.length < (w || 2)) n = '0' + n; return n; }
  function toLocalInput(d){
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function setMode(m){
    mode = m;
    $('modeDur').className = m === 'dur' ? 'on' : '';
    $('modeDate').className = m === 'date' ? 'on' : '';
    $('durBox').hidden = m !== 'dur';
    $('dateBox').hidden = m !== 'date';
    if (m === 'date') $('dt').min = toLocalInput(new Date());
    $('err').textContent = '';
  }
  $('modeDur').onclick = function(){ setMode('dur'); };
  $('modeDate').onclick = function(){ setMode('date'); };

  function addMonths(date, n){
    var d = new Date(date.getTime());
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d;
  }
  function computeEnd(from, spec){
    var d = addMonths(from, spec.y * 12 + spec.mo);
    return d.getTime() + spec.d * 86400000 + spec.h * 3600000 + spec.mi * 60000 + spec.s * 1000;
  }
  function breakdown(nowMs, endMs){
    var from = new Date(nowMs), to = new Date(endMs);
    var mm = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
    if (mm < 0) mm = 0;
    while (mm > 0 && addMonths(from, mm).getTime() > endMs) mm--;
    var rest = endMs - addMonths(from, mm).getTime();
    var days = Math.floor(rest / 86400000); rest -= days * 86400000;
    var hrs = Math.floor(rest / 3600000); rest -= hrs * 3600000;
    var mins = Math.floor(rest / 60000); rest -= mins * 60000;
    var secs = Math.floor(rest / 1000);
    return {y: Math.floor(mm / 12), mo: mm % 12, d: days, h: hrs, mi: mins, s: secs};
  }
  var names = {y:'سنة', mo:'شهر', d:'يوم', h:'ساعة', mi:'دقيقة', s:'ثانية'};

  function fmtEnd(ms){
    try {
      return new Intl.DateTimeFormat('ar-DZ-u-nu-latn', {dateStyle:'full', timeStyle:'short'}).format(new Date(ms));
    } catch(e){ return new Date(ms).toLocaleString(); }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function vibrate(){ try { if (navigator.vibrate) navigator.vibrate([300,150,300,150,300]); } catch(e){} }

  function notify(t){
    playSound(t.sound || 'beep', 2);
    vibrate();
    var title = 'انتهى المؤقت ⏰';
    var body = t.label || 'انتهى الوقت المحدد';
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(function(reg){
            reg.showNotification(title, {body: body, icon: 'icon-192.png', tag: t.id, vibrate:[300,150,300]});
          }).catch(function(){ new Notification(title, {body: body}); });
        } else {
          new Notification(title, {body: body});
        }
      }
    } catch(e){}
  }

  function render(){
    var list = $('list');
    if (!timers.length) {
      list.innerHTML = '<div class="empty">لا توجد مؤقتات بعد.<br>اضبط وقتاً من الأعلى ثم اضغط «ابدأ».</div>';
      return;
    }
    var html = '';
    timers.slice().sort(function(a,b){ return a.end - b.end; }).forEach(function(t){
      html += '<div class="card timer" data-id="'+t.id+'">'
        + '<div class="row"><div><div class="name">'+esc(t.label || 'مؤقت')+'</div>'
        + '<div class="end">ينتهي: '+fmtEnd(t.end)+'</div></div></div>'
        + '<div class="body"></div>'
        + '<div class="bar"><i></i></div>'
        + '<div class="acts">'
        + (t.spec ? '<button data-a="again">إعادة</button>' : '')
        + '<button class="del" data-a="del">حذف</button></div>'
        + '</div>';
    });
    list.innerHTML = html;
    tick();
  }

  function tick(){
    var now = Date.now();
    var changed = false;
    timers.forEach(function(t){
      if (now >= t.end && !t.done) { t.done = true; changed = true; notify(t); }
    });
    if (changed) save();

    var cards = document.querySelectorAll('.timer');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var t = timers.filter(function(x){ return x.id === card.getAttribute('data-id'); })[0];
      if (!t) continue;
      var body = card.querySelector('.body');
      var bar = card.querySelector('.bar i');
      if (now >= t.end) {
        card.classList.add('done');
        body.innerHTML = '<div class="doneText">✅ انتهى الوقت</div>';
        bar.style.width = '100%';
      } else {
        card.classList.remove('done');
        var b = breakdown(now, t.end);
        var started = false, out = '';
        ['y','mo','d','h','mi','s'].forEach(function(k){
          if (b[k] > 0) started = true;
          if (started) out += '<div class="u"><b>'+b[k]+'</b><span>'+names[k]+'</span></div>';
        });
        if (!out) out = '<div class="u"><b>0</b><span>ثانية</span></div>';
        body.innerHTML = '<div class="units">'+out+'</div>';
        var pct = ((now - t.start) / (t.end - t.start)) * 100;
        bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
      }
    }
  }

  $('start').onclick = function(){
    var now = Date.now();
    var timer = {
      id: 't' + now + Math.floor(Math.random() * 1000),
      label: $('label').value.trim(),
      sound: soundSel.value,
      start: now, done: false, spec: null
    };
    if (mode === 'dur') {
      var spec = readSpec();
      var total = spec.y + spec.mo + spec.d + spec.h + spec.mi + spec.s;
      if (total <= 0) { $('err').textContent = 'أدخل مدة أكبر من صفر.'; return; }
      var end = computeEnd(new Date(now), spec);
      if (!isFinite(end) || end > 8.64e15 || spec.y > 9000) { $('err').textContent = 'المدة كبيرة جداً.'; return; }
      timer.spec = spec; timer.end = end;
    } else {
      var v = $('dt').value;
      if (!v) { $('err').textContent = 'اختر التاريخ والوقت أولاً.'; return; }
      var e = new Date(v).getTime();
      if (!isFinite(e) || e <= now + 1000) { $('err').textContent = 'اختر تاريخاً ووقتاً في المستقبل.'; return; }
      timer.end = e;
    }
    $('err').textContent = '';
    timers.push(timer);
    save();
    $('label').value = '';
    fillFields({});
    $('dt').value = '';
    getCtx();
    try {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    } catch(e){}
    render();
  };

  $('list').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-a]');
    if (!btn) return;
    var card = btn.closest('.timer');
    var id = card.getAttribute('data-id');
    var t = timers.filter(function(x){ return x.id === id; })[0];
    if (!t) return;
    if (btn.getAttribute('data-a') === 'del') {
      timers = timers.filter(function(x){ return x.id !== id; });
    } else if (t.spec) {
      var now = Date.now();
      t.start = now; t.end = computeEnd(new Date(now), t.spec); t.done = false;
    }
    save(); render();
  });

  // ======================= الكرونومتر =======================
  var sw = {running:false, base:0, startedAt:0, laps:[]};
  try {
    var raw = JSON.parse(lsGet(SWKEY, 'null'));
    if (raw && typeof raw === 'object') {
      sw.running = !!raw.running;
      sw.base = +raw.base || 0;
      sw.startedAt = +raw.startedAt || 0;
      sw.laps = Array.isArray(raw.laps) ? raw.laps : [];
    }
  } catch(e){}
  function saveSw(){ lsSet(SWKEY, JSON.stringify(sw)); }
  function swElapsed(){ return sw.base + (sw.running ? Date.now() - sw.startedAt : 0); }

  function fmtSw(ms){
    var cs = Math.floor(ms / 10) % 100;
    var s = Math.floor(ms / 1000) % 60;
    var m = Math.floor(ms / 60000) % 60;
    var h = Math.floor(ms / 3600000);
    return {main: pad(h) + ':' + pad(m) + ':' + pad(s), cs: pad(cs)};
  }
  function fmtLap(ms){
    var f = fmtSw(ms);
    return f.main + '.' + f.cs;
  }

  function drawSw(){
    var f = fmtSw(swElapsed());
    $('swDisplay').innerHTML = f.main + '<small>.' + f.cs + '</small>';
  }
  function drawSwButtons(){
    var go = $('swGo');
    go.textContent = sw.running ? 'إيقاف' : (sw.base > 0 ? 'استئناف' : 'ابدأ');
    go.className = sw.running ? 'stop' : 'go';
    $('swLap').disabled = !sw.running;
    $('swReset').disabled = sw.running || (sw.base === 0 && !sw.laps.length);
  }
  function drawLaps(){
    var out = '';
    sw.laps.forEach(function(l){
      out += '<div class="lap"><span class="n">لفّة ' + l.n + '</span>'
        + '<span class="v">' + fmtLap(l.split) + '</span>'
        + '<span class="v tot">' + fmtLap(l.total) + '</span></div>';
    });
    $('laps').innerHTML = out;
  }

  $('swGo').onclick = function(){
    if (sw.running) {
      sw.base = swElapsed(); sw.running = false;
    } else {
      sw.startedAt = Date.now(); sw.running = true;
    }
    saveSw(); drawSwButtons(); drawSw();
  };
  $('swLap').onclick = function(){
    if (!sw.running) return;
    var total = swElapsed();
    var prev = sw.laps.length ? sw.laps[0].total : 0;
    sw.laps.unshift({n: sw.laps.length + 1, total: total, split: total - prev});
    saveSw(); drawLaps();
  };
  $('swReset').onclick = function(){
    sw = {running:false, base:0, startedAt:0, laps:[]};
    saveSw(); drawSwButtons(); drawSw(); drawLaps();
  };

  // ======================= تثبيت التطبيق =======================
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; $('install').style.display = 'block';
  });
  $('install').onclick = function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; $('install').style.display = 'none'; });
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // ======================= التشغيل =======================
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { tick(); drawSw(); } });
  render();
  drawSwButtons(); drawLaps(); drawSw();
  showTab(lsGet(TKEY, 'timer') === 'sw' ? 'sw' : 'timer');
  setInterval(tick, 500);
  setInterval(function(){ if (view === 'sw' && sw.running) drawSw(); }, 50);
})();
</script>
</body>
</html>
