<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مؤقت</title>
<script>
  try {
    var __t = localStorage.getItem('timer.theme');
    if (__t === 'light' || __t === 'dark') document.documentElement.setAttribute('data-theme', __t);
  } catch (e) {}
</script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --text:#f1f5f9; --muted:#94a3b8;
    --accent:#38bdf8; --accent2:#22d3ee; --ok:#4ade80; --danger:#f87171; --border:#334155;
    --onaccent:#06283d;
  }
  :root[data-theme="light"]{
    --bg:#f1f5f9; --card:#ffffff; --card2:#e8eef5; --text:#0f172a; --muted:#64748b;
    --accent:#0284c7; --accent2:#0891b2; --ok:#16a34a; --danger:#dc2626; --border:#cbd5e1;
    --onaccent:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
  body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
  h1{font-size:1.5rem;margin:0}
  #themeBtn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;
    width:44px;height:44px;font-size:1.3rem;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:16px}
  label.t{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 6px}
  label.t:first-child{margin-top:0}
  input[type=text],input[type=number],input[type=datetime-local],input[type=time],select{
    width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:12px;font-size:1rem;text-align:center;font-family:inherit}
  input[type=text]{text-align:right}
  select{text-align:right;appearance:auto}
  input[type=datetime-local],input[type=time]{min-height:48px}
  input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .grid label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .chip{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:999px;
    padding:7px 12px;font-size:.85rem;cursor:pointer;font-family:inherit}
  .chip:active{transform:scale(.96)}
  .chip.sel{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:700}
  button.primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);
    border:0;border-radius:14px;padding:14px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
  button.primary:active{transform:scale(.98)}
  .err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:8px 0 0;text-align:center}
  .empty{text-align:center;color:var(--muted);padding:28px 8px}

  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:5px;margin-bottom:16px}
  .tabs button{flex:1;background:transparent;color:var(--muted);border:0;border-radius:10px;
    padding:10px 4px;font-size:.95rem;font-family:inherit;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--text);font-weight:700}

  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;background:var(--bg);color:var(--muted);border:1px solid var(--border);
    border-radius:12px;padding:10px;font-size:.95rem;font-family:inherit;cursor:pointer}
  .seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}

  .soundBtns{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
  .soundBtns button{flex:1;min-width:110px;background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:10px 8px;font-size:.9rem;cursor:pointer;font-family:inherit}
  .soundBtns button.delS{color:var(--danger)}

  .timer,.alarm{position:relative;overflow:hidden}
  .timer.done{border-color:var(--ok)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-weight:700;font-size:1.05rem;word-break:break-word}
  .end{color:var(--muted);font-size:.8rem;margin-top:2px}
  .units{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 10px;direction:rtl}
  .u{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:58px;text-align:center}
  .u b{display:block;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
  .u span{font-size:.72rem;color:var(--muted)}
  .bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
  .done .bar i{background:var(--ok)}
  .doneText{text-align:center;color:var(--ok);font-weight:700;font-size:1.2rem;margin:14px 0 10px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:12px;padding:9px;font-size:.9rem;cursor:pointer;font-family:inherit}
  .acts button.del{color:var(--danger)}
  #install{display:none;margin-bottom:16px}

  .aTime{direction:ltr;font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .alarm.off{opacity:.55}
  .alarm .next{color:var(--accent);font-size:.9rem;margin-top:8px}
  .alarm.off .next{color:var(--muted)}

  .swDisplay{direction:ltr;text-align:center;font-variant-numeric:tabular-nums;
    font-size:clamp(2.2rem,12vw,3.4rem);font-weight:700;letter-spacing:1px;margin:18px 0 22px}
  .swDisplay small{font-size:.5em;color:var(--accent);font-weight:600}
  .swBtns{display:flex;gap:10px}
  .swBtns button{flex:1;border:1px solid var(--border);border-radius:14px;padding:14px;font-size:1rem;
    cursor:pointer;font-family:inherit;background:var(--card2);color:var(--text)}
  .swBtns button.go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border:0;font-weight:700}
  .swBtns button.stop{background:var(--danger);color:#fff;border:0;font-weight:700}
  .swBtns button:disabled{opacity:.4}
  .laps{margin-top:16px}
  .lap{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--border);
    font-variant-numeric:tabular-nums}
  .lap .n{color:var(--muted);min-width:56px}
  .lap .v{direction:ltr}
  .lap .tot{color:var(--muted)}

  #ring{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  #ring .bell{font-size:5rem;animation:shake .5s infinite}
  @keyframes shake{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  #ring h2{margin:0;font-size:1.7rem;color:#fff;word-break:break-word}
  #ring p{margin:0;color:#cbd5e1;font-size:1.1rem}
  #ring button{margin-top:18px;background:#f87171;color:#2b0a0a;border:0;border-radius:16px;
    padding:16px 48px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>⏳ مؤقت</h1>
    <button id="themeBtn" type="button" aria-label="تبديل الثيم">☀️</button>
  </div>

  <div class="tabs">
    <button id="tabTimer" class="on" type="button">المؤقت</button>
    <button id="tabAlarm" type="button">المنبّه</button>
    <button id="tabSw" type="button">الكرونومتر</button>
  </div>

  <button id="install" class="primary">تثبيت التطبيق على الهاتف</button>

  <!-- ===== المؤقت ===== -->
  <section id="vTimer">
    <div class="card">
      <label class="t" for="label">اسم المؤقت (اختياري)</label>
      <input type="text" id="label" placeholder="مثال: الامتحان، السفر، موعد الدواء" maxlength="60">

      <div class="seg" style="margin-top:14px">
        <button type="button" id="modeDur" class="on">بعد مدة</button>
        <button type="button" id="modeDate">حتى تاريخ محدد</button>
      </div>

      <div id="durBox">
        <div class="grid">
          <div><label for="y">سنوات</label><input type="number" id="y" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="mo">أشهر</label><input type="number" id="mo" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="d">أيام</label><input type="number" id="d" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="h">ساعات</label><input type="number" id="h" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="mi">دقائق</label><input type="number" id="mi" min="0" inputmode="numeric" placeholder="0"></div>
          <div><label for="s">ثوانٍ</label><input type="number" id="s" min="0" inputmode="numeric" placeholder="0"></div>
        </div>
        <label class="t">اختيارات سريعة</label>
        <div class="chips" id="chips"></div>
      </div>

      <div id="dateBox" hidden style="margin:12px 0 4px">
        <label class="t" for="dt">يتوقف المؤقت في هذا التاريخ والوقت</label>
        <input type="datetime-local" id="dt">
      </div>

      <div class="soundBlock" data-p="t"></div>

      <button class="primary" id="start">ابدأ المؤقت</button>
      <p class="err" id="err"></p>
    </div>

    <div id="list"></div>
  </section>

  <!-- ===== المنبه ===== -->
  <section id="vAlarm" hidden>
    <div class="card">
      <label class="t" for="aTime">وقت المنبّه</label>
      <input type="time" id="aTime" value="07:00">

      <label class="t" for="aLabel">الاسم (اختياري)</label>
      <input type="text" id="aLabel" placeholder="مثال: الاستيقاظ، صلاة الفجر" maxlength="60">

      <label class="t">التكرار (بدون اختيار = مرة واحدة)</label>
      <div class="chips" id="aDays"></div>

      <div class="soundBlock" data-p="a"></div>

      <button class="primary" id="aAdd">إضافة المنبّه</button>
      <p class="err" id="aErr"></p>
    </div>
    <div id="aList"></div>
  </section>

  <!-- ===== الكرونومتر ===== -->
  <section id="vSw" hidden>
    <div class="card">
      <div class="swDisplay" id="swDisplay">00:00:00<small>.00</small></div>
      <div class="swBtns">
        <button type="button" id="swReset" disabled>تصفير</button>
        <button type="button" id="swLap" disabled>لفّة</button>
        <button type="button" id="swGo" class="go">ابدأ</button>
      </div>
      <div class="laps" id="laps"></div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="audio/*" hidden>

<div id="ring" hidden>
  <div class="bell">🔔</div>
  <h2 id="ringTitle"></h2>
  <p id="ringBody"></p>
  <button type="button" id="ringStop">إيقاف</button>
</div>

<script>
(function(){
  var KEY = 'timers.v1', SKEY = 'timer.sound', TKEY = 'timer.tab', SWKEY = 'sw.v1', AKEY = 'alarms.v1', THKEY = 'timer.theme';
  var $ = function(id){ return document.getElementById(id); };

  function lsGet(k, def){ try { var v = localStorage.getItem(k); return v === null ? def : v; } catch(e){ return def; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function pad(n, w){ n = String(n); while (n.length < (w || 2)) n = '0' + n; return n; }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var timers = [];
  try { timers = JSON.parse(lsGet(KEY, '[]')) || []; } catch(e){ timers = []; }
  function save(){ lsSet(KEY, JSON.stringify(timers)); }

  var alarms = [];
  try { alarms = JSON.parse(lsGet(AKEY, '[]')) || []; } catch(e){ alarms = []; }
  function saveAlarms(){ lsSet(AKEY, JSON.stringify(alarms)); }

  // ======================= الثيم =======================
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    $('themeBtn').textContent = t === 'light' ? '🌙' : '☀️';
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', t === 'light' ? '#f1f5f9' : '#0f172a');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  $('themeBtn').onclick = function(){
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next); lsSet(THKEY, next);
  };

  // ======================= الصوت =======================
  var actx = null;
  function getCtx(){
    try {
      if (!actx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        actx = new C();
      }
      if (actx.state === 'suspended') actx.resume();
    } catch(e){ return null; }
    return actx;
  }
  ['click','touchstart','keydown'].forEach(function(ev){
    document.addEventListener(ev, function(){ getCtx(); }, {passive:true});
  });

  function tone(c, freq, start, dur, type, gain){
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }
  function sweep(c, f1, f2, start, dur, gain){
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f1, start);
    o.frequency.exponentialRampToValueAtTime(f2, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }

  var SOUNDS = {
    beep:  {name:'بيب كلاسيكي', len:1500, play:function(c,t){ [0,.35,.7].forEach(function(o){ tone(c,880,t+o,.2,'sine',.25); }); }},
    bell:  {name:'جرس',          len:2800, play:function(c,t){
      [0,1.3].forEach(function(o){
        tone(c,1318,t+o,1.4,'sine',.3); tone(c,1760,t+o,1.1,'sine',.14); tone(c,2637,t+o,.7,'sine',.07);
      });
    }},
    alarm: {name:'منبّه',        len:1700, play:function(c,t){
      for (var i = 0; i < 8; i++) tone(c, i % 2 ? 1000 : 760, t + i * .2, .17, 'square', .12);
    }},
    soft:  {name:'نغمة هادئة',   len:2200, play:function(c,t){
      [523,659,784,1047].forEach(function(f,i){ tone(c,f,t+i*.28,1,'sine',.22); });
    }},
    chime: {name:'رنين',         len:1700, play:function(c,t){
      [1568,1319,1047,1319,1568].forEach(function(f,i){ tone(c,f,t+i*.22,.5,'triangle',.2); });
    }},
    siren: {name:'صفّارة',       len:2300, play:function(c,t){
      for (var i = 0; i < 3; i++) sweep(c, 450, 1200, t + i * .75, .7, .12);
    }},
    none:  {name:'بدون صوت',     len:0,    play:function(){}}
  };

  function playBuiltin(name){
    var s = SOUNDS[name];
    if (!s || name === 'none') return;
    var c = getCtx();
    if (!c) return;
    try { s.play(c, c.currentTime + 0.03); } catch(e){}
  }

  // ---------- الأصوات المخصصة (من الهاتف) ----------
  var customs = {}; // id -> {name, url}
  var DBN = 'timer-sounds';
  function idb(){
    return new Promise(function(res, rej){
      if (!window.indexedDB) { rej(new Error('no idb')); return; }
      var r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('s', {keyPath:'id'}); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function idbAll(){
    return idb().then(function(db){
      return new Promise(function(res, rej){
        var q = db.transaction('s').objectStore('s').getAll();
        q.onsuccess = function(){ res(q.result); };
        q.onerror = function(){ rej(q.error); };
      });
    });
  }
  function idbPut(o){
    return idb().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction('s', 'readwrite');
        tx.objectStore('s').put(o);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
      });
    });
  }
  function idbDel(id){
    return idb().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction('s', 'readwrite');
        tx.objectStore('s').delete(id);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
      });
    });
  }

  function customOf(key){
    return (key && key.indexOf('u:') === 0) ? customs[key.slice(2)] : null;
  }

  var previewAudio = null, previewTimer = null;
  function stopPreview(){
    clearTimeout(previewTimer);
    if (previewAudio) { try { previewAudio.pause(); } catch(e){} previewAudio = null; }
  }
  function previewSound(key){
    stopPreview();
    var c = customOf(key);
    if (c) {
      previewAudio = new Audio(c.url);
      var p = previewAudio.play(); if (p && p.catch) p.catch(function(){});
      previewTimer = setTimeout(stopPreview, 6000);
    } else {
      playBuiltin(key);
    }
  }

  // ---------- قوائم اختيار الصوت ----------
  var sels = {};      // prefix -> select
  var delBtns = {};   // prefix -> delete button
  var pendingPrefix = 't';

  function buildSoundBlock(host){
    var p = host.getAttribute('data-p');
    host.innerHTML = '<label class="t" for="' + p + 'Sound">صوت التنبيه</label>'
      + '<select id="' + p + 'Sound"></select>'
      + '<div class="soundBtns">'
      + '<button type="button" data-s="test">▶ تجربة</button>'
      + '<button type="button" data-s="add">＋ صوت من الهاتف</button>'
      + '<button type="button" data-s="del" class="delS" hidden>🗑 حذف الصوت</button>'
      + '</div>';
    sels[p] = host.querySelector('select');
    delBtns[p] = host.querySelector('[data-s=del]');
    host.addEventListener('click', function(e){
      var b = e.target.closest('button[data-s]');
      if (!b) return;
      var a = b.getAttribute('data-s');
      if (a === 'test') previewSound(sels[p].value);
      else if (a === 'add') { pendingPrefix = p; $('file').value = ''; $('file').click(); }
      else if (a === 'del') removeCustom(sels[p].value);
    });
    sels[p].onchange = function(){
      if (p === 't') lsSet(SKEY, sels[p].value);
      updateDel(); previewSound(sels[p].value);
    };
  }
  Array.prototype.forEach.call(document.querySelectorAll('.soundBlock'), buildSoundBlock);

  function fillSelects(){
    Object.keys(sels).forEach(function(p){
      var sel = sels[p], cur = sel.value;
      sel.innerHTML = '';
      Object.keys(SOUNDS).forEach(function(k){
        var op = document.createElement('option');
        op.value = k; op.textContent = SOUNDS[k].name; sel.appendChild(op);
      });
      Object.keys(customs).forEach(function(id){
        var op = document.createElement('option');
        op.value = 'u:' + id; op.textContent = '🎵 ' + customs[id].name; sel.appendChild(op);
      });
      sel.value = cur;
      if (!sel.value) sel.value = 'beep';
    });
    updateDel();
  }
  function updateDel(){
    Object.keys(sels).forEach(function(p){ delBtns[p].hidden = !customOf(sels[p].value); });
  }

  var savedSound = lsGet(SKEY, 'beep');
  fillSelects();
  if (SOUNDS[savedSound]) { sels.t.value = savedSound; sels.a.value = savedSound; updateDel(); }

  idbAll().then(function(rows){
    rows.forEach(function(r){
      try { customs[r.id] = {name: r.name, url: URL.createObjectURL(r.blob)}; } catch(e){}
    });
    fillSelects();
    if (customOf(savedSound)) { sels.t.value = savedSound; sels.a.value = savedSound; updateDel(); }
  }).catch(function(){});

  $('file').onchange = function(){
    var f = $('file').files && $('file').files[0];
    if (!f) return;
    var errEl = pendingPrefix === 'a' ? $('aErr') : $('err');
    if (f.size > 20 * 1024 * 1024) { errEl.textContent = 'الملف كبير جداً (الحد 20 ميغابايت).'; return; }
    var id = 'c' + Date.now();
    var name = f.name.replace(/\.[^.]+$/, '').slice(0, 40) || 'صوت';
    customs[id] = {name: name, url: URL.createObjectURL(f)};
    errEl.textContent = '';
    fillSelects();
    sels[pendingPrefix].value = 'u:' + id;
    if (pendingPrefix === 't') lsSet(SKEY, 'u:' + id);
    updateDel();
    idbPut({id: id, name: name, blob: f}).catch(function(){
      errEl.textContent = 'تعذّر حفظ الصوت دائماً؛ سيعمل حتى إغلاق التطبيق فقط.';
    });
    previewSound('u:' + id);
  };

  function removeCustom(key){
    var c = customOf(key);
    if (!c) return;
    if (!window.confirm('حذف الصوت «' + c.name + '»؟')) return;
    var id = key.slice(2);
    try { URL.revokeObjectURL(c.url); } catch(e){}
    delete customs[id];
    idbDel(id).catch(function(){});
    stopPreview();
    fillSelects();
  }

  // ======================= الرنين =======================
  var ringState = null;
  function vibrate(){ try { if (navigator.vibrate) navigator.vibrate([300,150,300,150,300]); } catch(e){} }

  function askNotif(){
    try {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    } catch(e){}
  }
  function showNote(title, body, tag){
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(function(reg){
          reg.showNotification(title, {body: body, icon: 'icon-192.png', tag: tag, vibrate: [300,150,300], requireInteraction: true});
        }).catch(function(){ try { new Notification(title, {body: body}); } catch(e){} });
      } else {
        new Notification(title, {body: body});
      }
    } catch(e){}
  }

  function stopRing(){
    if (!ringState) return;
    var st = ringState; ringState = null;
    clearTimeout(st.timer); clearInterval(st.vib); clearTimeout(st.stop);
    if (st.audio) { try { st.audio.pause(); } catch(e){} }
    $('ring').hidden = true;
  }
  function ring(title, body, key, tag){
    stopRing();
    var st = {};
    ringState = st;
    $('ringTitle').textContent = title;
    $('ringBody').textContent = body || '';
    $('ring').hidden = false;
    if (!key) key = 'beep';
    var c = customOf(key);
    if (key.indexOf('u:') === 0 && !c) key = 'beep';
    if (c) {
      st.audio = new Audio(c.url); st.audio.loop = true;
      var p = st.audio.play(); if (p && p.catch) p.catch(function(){});
    } else if (key !== 'none' && SOUNDS[key]) {
      (function loop(){
        if (ringState !== st) return;
        playBuiltin(key);
        st.timer = setTimeout(loop, SOUNDS[key].len + 400);
      })();
    }
    vibrate(); st.vib = setInterval(vibrate, 3000);
    st.stop = setTimeout(stopRing, 120000);
    showNote(title, body, tag || 'ring');
  }
  $('ringStop').onclick = stopRing;

  // ======================= التبويبات =======================
  var view = 'timer';
  function showTab(n){
    view = n;
    $('vTimer').hidden = n !== 'timer';
    $('vAlarm').hidden = n !== 'alarm';
    $('vSw').hidden = n !== 'sw';
    $('tabTimer').className = n === 'timer' ? 'on' : '';
    $('tabAlarm').className = n === 'alarm' ? 'on' : '';
    $('tabSw').className = n === 'sw' ? 'on' : '';
    lsSet(TKEY, n);
    if (n === 'sw') drawSw();
    if (n === 'alarm') updateAlarmTexts();
  }
  $('tabTimer').onclick = function(){ showTab('timer'); };
  $('tabAlarm').onclick = function(){ showTab('alarm'); };
  $('tabSw').onclick = function(){ showTab('sw'); };

  // ======================= المؤقت =======================
  var fields = ['y','mo','d','h','mi','s'];
  var mode = 'dur';

  var presets = [
    ['30 ثانية',{s:30}], ['5 دقائق',{mi:5}], ['25 دقيقة',{mi:25}], ['ساعة',{h:1}],
    ['يوم',{d:1}], ['أسبوع',{d:7}], ['شهر',{mo:1}], ['سنة',{y:1}], ['5 سنوات',{y:5}]
  ];
  presets.forEach(function(p){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = p[0];
    b.onclick = function(){ fillFields(p[1]); };
    $('chips').appendChild(b);
  });
  function fillFields(spec){ fields.forEach(function(f){ $(f).value = spec[f] ? spec[f] : ''; }); }
  function readSpec(){
    var spec = {};
    fields.forEach(function(f){
      var v = parseInt($(f).value, 10);
      spec[f] = (isFinite(v) && v > 0) ? v : 0;
    });
    return spec;
  }
  function toLocalInput(d){
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function setMode(m){
    mode = m;
    $('modeDur').className = m === 'dur' ? 'on' : '';
    $('modeDate').className = m === 'date' ? 'on' : '';
    $('durBox').hidden = m !== 'dur';
    $('dateBox').hidden = m !== 'date';
    if (m === 'date') $('dt').min = toLocalInput(new Date());
    $('err').textContent = '';
  }
  $('modeDur').onclick = function(){ setMode('dur'); };
  $('modeDate').onclick = function(){ setMode('date'); };

  function addMonths(date, n){
    var d = new Date(date.getTime());
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d;
  }
  function computeEnd(from, spec){
    var d = addMonths(from, spec.y * 12 + spec.mo);
    return d.getTime() + spec.d * 86400000 + spec.h * 3600000 + spec.mi * 60000 + spec.s * 1000;
  }
  function breakdown(nowMs, endMs){
    var from = new Date(nowMs), to = new Date(endMs);
    var mm = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
    if (mm < 0) mm = 0;
    while (mm > 0 && addMonths(from, mm).getTime() > endMs) mm--;
    var rest = endMs - addMonths(from, mm).getTime();
    var days = Math.floor(rest / 86400000); rest -= days * 86400000;
    var hrs = Math.floor(rest / 3600000); rest -= hrs * 3600000;
    var mins = Math.floor(rest / 60000); rest -= mins * 60000;
    var secs = Math.floor(rest / 1000);
    return {y: Math.floor(mm / 12), mo: mm % 12, d: days, h: hrs, mi: mins, s: secs};
  }
  var names = {y:'سنة', mo:'شهر', d:'يوم', h:'ساعة', mi:'دقيقة', s:'ثانية'};

  function fmtEnd(ms){
    try {
      return new Intl.DateTimeFormat('ar-DZ-u-nu-latn', {dateStyle:'full', timeStyle:'short'}).format(new Date(ms));
    } catch(e){ return new Date(ms).toLocaleString(); }
  }

  function render(){
    var list = $('list');
    if (!timers.length) {
      list.innerHTML = '<div class="empty">لا توجد مؤقتات بعد.<br>اضبط وقتاً من الأعلى ثم اضغط «ابدأ».</div>';
      return;
    }
    var html = '';
    timers.slice().sort(function(a,b){ return a.end - b.end; }).forEach(function(t){
      html += '<div class="card timer" data-id="'+t.id+'">'
        + '<div class="row"><div><div class="name">'+esc(t.label || 'مؤقت')+'</div>'
        + '<div class="end">ينتهي: '+fmtEnd(t.end)+'</div></div></div>'
        + '<div class="body"></div>'
        + '<div class="bar"><i></i></div>'
        + '<div class="acts">'
        + (t.spec ? '<button data-a="again">إعادة</button>' : '')
        + '<button class="del" data-a="del">حذف</button></div>'
        + '</div>';
    });
    list.innerHTML = html;
    tick();
  }

  function tick(){
    var now = Date.now();
    var changed = false;
    timers.forEach(function(t){
      if (now >= t.end && !t.done) {
        t.done = true; changed = true;
        // لا نُرنّ للمؤقتات التي انتهت منذ زمن (التطبيق كان مغلقاً)
        if (now - t.end < 60000) ring('انتهى المؤقت ⏰', t.label || 'انتهى الوقت المحدد', t.sound, t.id);
      }
    });
    if (changed) save();

    var cards = document.querySelectorAll('.timer');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var t = timers.filter(function(x){ return x.id === card.getAttribute('data-id'); })[0];
      if (!t) continue;
      var body = card.querySelector('.body');
      var bar = card.querySelector('.bar i');
      if (now >= t.end) {
        card.classList.add('done');
        body.innerHTML = '<div class="doneText">✅ انتهى الوقت</div>';
        bar.style.width = '100%';
      } else {
        card.classList.remove('done');
        var b = breakdown(now, t.end);
        var started = false, out = '';
        ['y','mo','d','h','mi','s'].forEach(function(k){
          if (b[k] > 0) started = true;
          if (started) out += '<div class="u"><b>'+b[k]+'</b><span>'+names[k]+'</span></div>';
        });
        if (!out) out = '<div class="u"><b>0</b><span>ثانية</span></div>';
        body.innerHTML = '<div class="units">'+out+'</div>';
        var pct = ((now - t.start) / (t.end - t.start)) * 100;
        bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
      }
    }
  }

  $('start').onclick = function(){
    var now = Date.now();
    var timer = {
      id: 't' + now + Math.floor(Math.random() * 1000),
      label: $('label').value.trim(),
      sound: sels.t.value,
      start: now, done: false, spec: null
    };
    if (mode === 'dur') {
      var spec = readSpec();
      var total = spec.y + spec.mo + spec.d + spec.h + spec.mi + spec.s;
      if (total <= 0) { $('err').textContent = 'أدخل مدة أكبر من صفر.'; return; }
      var end = computeEnd(new Date(now), spec);
      if (!isFinite(end) || end > 8.64e15 || spec.y > 9000) { $('err').textContent = 'المدة كبيرة جداً.'; return; }
      timer.spec = spec; timer.end = end;
    } else {
      var v = $('dt').value;
      if (!v) { $('err').textContent = 'اختر التاريخ والوقت أولاً.'; return; }
      var e = new Date(v).getTime();
      if (!isFinite(e) || e <= now + 1000) { $('err').textContent = 'اختر تاريخاً ووقتاً في المستقبل.'; return; }
      timer.end = e;
    }
    $('err').textContent = '';
    timers.push(timer);
    save();
    $('label').value = '';
    fillFields({});
    $('dt').value = '';
    getCtx(); askNotif();
    render();
  };

  $('list').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-a]');
    if (!btn) return;
    var card = btn.closest('.timer');
    var id = card.getAttribute('data-id');
    var t = timers.filter(function(x){ return x.id === id; })[0];
    if (!t) return;
    if (btn.getAttribute('data-a') === 'del') {
      timers = timers.filter(function(x){ return x.id !== id; });
    } else if (t.spec) {
      var now = Date.now();
      t.start = now; t.end = computeEnd(new Date(now), t.spec); t.done = false;
    }
    save(); render();
  });

  // ======================= المنبّه =======================
  var dayNames = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var selDays = [];
  dayNames.forEach(function(n, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = n;
    b.onclick = function(){
      var k = selDays.indexOf(i);
      if (k > -1) { selDays.splice(k, 1); b.classList.remove('sel'); }
      else { selDays.push(i); b.classList.add('sel'); }
    };
    $('aDays').appendChild(b);
  });

  function nextMs(a){
    var now = new Date(), p = a.time.split(':'), h = +p[0], m = +p[1];
    for (var i = 0; i < 8; i++) {
      var c = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, h, m, 0, 0);
      if (c.getTime() > now.getTime() && (!a.days.length || a.days.indexOf(c.getDay()) > -1)) return c.getTime();
    }
    return null;
  }
  function fmtRemain(ms){
    var s = Math.floor(ms / 1000);
    if (s < 60) return 'يرنّ بعد أقل من دقيقة';
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60);
    var parts = [];
    if (d) parts.push(d + ' يوم');
    if (h) parts.push(h + ' ساعة');
    if (m) parts.push(m + ' دقيقة');
    return 'يرنّ بعد ' + parts.join(' و ');
  }
  function daysText(a){
    if (!a.days.length) return 'مرة واحدة';
    if (a.days.length === 7) return 'كل يوم';
    return a.days.map(function(d){ return dayNames[d]; }).join('، ');
  }

  function renderAlarms(){
    var box = $('aList');
    if (!alarms.length) {
      box.innerHTML = '<div class="empty">لا توجد منبّهات بعد.<br>اضبط الوقت من الأعلى ثم اضغط «إضافة».</div>';
      return;
    }
    var html = '';
    alarms.slice().sort(function(a,b){ return a.time < b.time ? -1 : 1; }).forEach(function(a){
      html += '<div class="card alarm' + (a.on ? '' : ' off') + '" data-id="' + a.id + '">'
        + '<div class="row"><div class="aTime">' + a.time + '</div>'
        + '<div style="text-align:left"><div class="name">' + esc(a.label || 'منبّه') + '</div>'
        + '<div class="end">' + esc(daysText(a)) + '</div></div></div>'
        + '<div class="next"></div>'
        + '<div class="acts"><button data-a="tog">' + (a.on ? 'إيقاف' : 'تفعيل') + '</button>'
        + '<button class="del" data-a="del">حذف</button></div></div>';
    });
    box.innerHTML = html;
    updateAlarmTexts();
  }
  function updateAlarmTexts(){
    var cards = document.querySelectorAll('.alarm');
    for (var i = 0; i < cards.length; i++) {
      var a = alarms.filter(function(x){ return x.id === cards[i].getAttribute('data-id'); })[0];
      if (!a) continue;
      var n = a.on ? nextMs(a) : null;
      cards[i].querySelector('.next').textContent = a.on && n ? fmtRemain(n - Date.now()) : 'متوقف';
    }
  }
  function checkAlarms(){
    var now = new Date(), hhmm = pad(now.getHours()) + ':' + pad(now.getMinutes());
    var key = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + hhmm;
    var changed = false;
    alarms.forEach(function(a){
      if (!a.on || a.time !== hhmm || a.last === key) return;
      if (a.days.length && a.days.indexOf(now.getDay()) < 0) return;
      a.last = key; changed = true;
      if (!a.days.length) a.on = false;
      ring('⏰ ' + (a.label || 'المنبّه'), 'الساعة ' + a.time, a.sound, a.id);
    });
    if (changed) { saveAlarms(); renderAlarms(); }
  }

  $('aAdd').onclick = function(){
    var time = $('aTime').value;
    if (!/^\d{2}:\d{2}$/.test(time)) { $('aErr').textContent = 'اختر وقت المنبّه أولاً.'; return; }
    $('aErr').textContent = '';
    alarms.push({
      id: 'a' + Date.now() + Math.floor(Math.random() * 1000),
      time: time, label: $('aLabel').value.trim(),
      days: selDays.slice().sort(), sound: sels.a.value, on: true, last: ''
    });
    saveAlarms();
    $('aLabel').value = '';
    selDays = [];
    Array.prototype.forEach.call($('aDays').children, function(b){ b.classList.remove('sel'); });
    getCtx(); askNotif();
    renderAlarms();
  };
  $('aList').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-a]');
    if (!btn) return;
    var id = btn.closest('.alarm').getAttribute('data-id');
    var a = alarms.filter(function(x){ return x.id === id; })[0];
    if (!a) return;
    if (btn.getAttribute('data-a') === 'del') alarms = alarms.filter(function(x){ return x.id !== id; });
    else { a.on = !a.on; a.last = ''; if (a.on) askNotif(); }
    saveAlarms(); renderAlarms();
  });

  // ======================= الكرونومتر =======================
  var sw = {running:false, base:0, startedAt:0, laps:[]};
  try {
    var raw = JSON.parse(lsGet(SWKEY, 'null'));
    if (raw && typeof raw === 'object') {
      sw.running = !!raw.running;
      sw.base = +raw.base || 0;
      sw.startedAt = +raw.startedAt || 0;
      sw.laps = Array.isArray(raw.laps) ? raw.laps : [];
    }
  } catch(e){}
  function saveSw(){ lsSet(SWKEY, JSON.stringify(sw)); }
  function swElapsed(){ return sw.base + (sw.running ? Date.now() - sw.startedAt : 0); }

  function fmtSw(ms){
    var cs = Math.floor(ms / 10) % 100;
    var s = Math.floor(ms / 1000) % 60;
    var m = Math.floor(ms / 60000) % 60;
    var h = Math.floor(ms / 3600000);
    return {main: pad(h) + ':' + pad(m) + ':' + pad(s), cs: pad(cs)};
  }
  function fmtLap(ms){ var f = fmtSw(ms); return f.main + '.' + f.cs; }

  function drawSw(){
    var f = fmtSw(swElapsed());
    $('swDisplay').innerHTML = f.main + '<small>.' + f.cs + '</small>';
  }
  function drawSwButtons(){
    var go = $('swGo');
    go.textContent = sw.running ? 'إيقاف' : (sw.base > 0 ? 'استئناف' : 'ابدأ');
    go.className = sw.running ? 'stop' : 'go';
    $('swLap').disabled = !sw.running;
    $('swReset').disabled = sw.running || (sw.base === 0 && !sw.laps.length);
  }
  function drawLaps(){
    var out = '';
    sw.laps.forEach(function(l){
      out += '<div class="lap"><span class="n">لفّة ' + l.n + '</span>'
        + '<span class="v">' + fmtLap(l.split) + '</span>'
        + '<span class="v tot">' + fmtLap(l.total) + '</span></div>';
    });
    $('laps').innerHTML = out;
  }

  $('swGo').onclick = function(){
    if (sw.running) { sw.base = swElapsed(); sw.running = false; }
    else { sw.startedAt = Date.now(); sw.running = true; }
    saveSw(); drawSwButtons(); drawSw();
  };
  $('swLap').onclick = function(){
    if (!sw.running) return;
    var total = swElapsed();
    var prev = sw.laps.length ? sw.laps[0].total : 0;
    sw.laps.unshift({n: sw.laps.length + 1, total: total, split: total - prev});
    saveSw(); drawLaps();
  };
  $('swReset').onclick = function(){
    sw = {running:false, base:0, startedAt:0, laps:[]};
    saveSw(); drawSwButtons(); drawSw(); drawLaps();
  };

  // ======================= تثبيت التطبيق =======================
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; $('install').style.display = 'block';
  });
  $('install').onclick = function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; $('install').style.display = 'none'; });
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // ======================= التشغيل =======================
  var lastAlarmText = 0;
  function master(){
    tick();
    checkAlarms();
    if (view === 'alarm' && Date.now() - lastAlarmText > 1000) { lastAlarmText = Date.now(); updateAlarmTexts(); }
  }
  // مؤقت داخل Web Worker حتى لا يُبطَّأ عندما تكون الصفحة في الخلفية
  (function startTicker(){
    try {
      var blob = new Blob(['setInterval(function(){postMessage(1)},500)'], {type:'application/javascript'});
      var w = new Worker(URL.createObjectURL(blob));
      w.onmessage = master;
      return;
    } catch(e){}
    setInterval(master, 500);
  })();

  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { master(); drawSw(); } });
  render(); renderAlarms();
  drawSwButtons(); drawLaps(); drawSw();
  var tab = lsGet(TKEY, 'timer');
  showTab(tab === 'sw' || tab === 'alarm' ? tab : 'timer');
  setInterval(function(){ if (view === 'sw' && sw.running) drawSw(); }, 50);
})();
</script>
</body>
